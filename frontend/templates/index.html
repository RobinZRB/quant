<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票量化回测系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>" type="image/svg+xml">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container-fluid p-0">
        {% include 'navbar.html' %}

        <div class="content pt-4">
            <div class="hero-section">
                <div class="row align-items-center">
                    <div class="col-lg-8">
                        <h1 class="hero-title"><i class="fas fa-chart-line me-3"></i>股票量化回测系统</h1>
                        <p class="hero-subtitle">数据获取、回测分析、信号检测，一站式量化投资研究平台</p>
                    </div>
                </div>
            </div>

            <div class="action-cards">
                <div class="action-card" id="data-acquisition">
                    <div class="action-card-header">
                        <div class="action-card-icon data"><i class="fas fa-database"></i></div>
                        <div>
                            <h5 class="action-card-title">数据获取</h5>
                            <p class="action-card-subtitle">获取股票历史行情数据</p>
                        </div>
                    </div>
                    <div class="action-card-body">
                        <form id="dataAcquisitionForm">
                            <div class="form-grid">
                                <div class="modern-form-group">
                                    <label class="modern-label"><i class="fas fa-server"></i>数据源</label>
                                    <select class="modern-select" id="dataSourceAcquire" required>
                                        <option value="">请选择</option>
                                        <option value="akshare">akshare</option>
                                        <option value="baostock">baostock</option>
                                        <option value="futu">futu</option>
                                    </select>
                                </div>
                                <div class="modern-form-group">
                                    <label class="modern-label"><i class="fas fa-globe"></i>市场</label>
                                    <select class="modern-select" id="market" required>
                                        <option value="">请选择</option>
                                    </select>
                                </div>
                                <div class="modern-form-group">
                                    <label class="modern-label"><i class="fas fa-code"></i>股票代码</label>
                                    <input type="text" class="modern-input" id="stockCode" placeholder="HK.00700, US.IVV" required>
                                </div>
                                <div class="modern-form-group">
                                    <label class="modern-label"><i class="fas fa-adjust"></i>复权类型</label>
                                    <select class="modern-select" id="adjustType">
                                        <option value="qfq">前复权</option>
                                        <option value="hfq">后复权</option>
                                        <option value="bfq">不复权</option>
                                    </select>
                                </div>
                                <div class="modern-form-group">
                                    <label class="modern-label"><i class="fas fa-calendar"></i>开始日期</label>
                                    <input type="date" class="modern-input" id="startDate" required>
                                </div>
                                <div class="modern-form-group">
                                    <label class="modern-label"><i class="fas fa-calendar"></i>结束日期</label>
                                    <input type="date" class="modern-input" id="endDate" required>
                                </div>
                                <div class="modern-form-group col-span-2">
                                    <button type="submit" class="modern-btn modern-btn-primary">
                                        <i class="fas fa-download"></i>获取数据
                                    </button>
                                </div>
                            </div>
                        </form>
                        <div id="dataAcquisitionResult" class="mt-3"></div>
                    </div>
                </div>

                <div class="action-card" id="batch-download">
                    <div class="action-card-header">
                        <div class="action-card-icon data"><i class="fas fa-layer-group"></i></div>
                        <div>
                            <h5 class="action-card-title">批量下载 A股</h5>
                            <p class="action-card-subtitle">获取全市场A股列表并批量下载K线数据</p>
                        </div>
                    </div>
                    <div class="action-card-body">
                        <div class="form-grid">
                            <div class="modern-form-group" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
                                <label style="display:flex;align-items:center;gap:4px;font-size:13px;color:#b0b0b0;white-space:nowrap;">
                                    <input type="checkbox" id="exclude3xx" checked> 排除创业板(3xx)
                                </label>
                                <label style="display:flex;align-items:center;gap:4px;font-size:13px;color:#b0b0b0;white-space:nowrap;">
                                    <input type="checkbox" id="excludeST" checked> 排除ST
                                </label>
                                <label style="display:flex;align-items:center;gap:4px;font-size:13px;color:#b0b0b0;white-space:nowrap;">
                                    <input type="checkbox" id="excludeDelisted" checked> 排除退市
                                </label>
                                <label style="display:flex;align-items:center;gap:4px;font-size:13px;color:#b0b0b0;white-space:nowrap;">
                                    <input type="checkbox" id="excludeMainBoard" onchange="renderStockList()"> 剔除主板
                                </label>
                                <label style="display:flex;align-items:center;gap:4px;font-size:13px;color:#b0b0b0;white-space:nowrap;">
                                    <input type="checkbox" id="excludeSTAR" onchange="renderStockList()"> 剔除科创板
                                </label>
                            </div>
                            <div class="modern-form-group">
                                <label class="modern-label"><i class="fas fa-filter"></i>仅保留前缀(逗号分隔)</label>
                                <input type="text" class="modern-input" id="includePrefix" placeholder="如: 600,601,603">
                            </div>
                            <div class="modern-form-group col-span-2" style="display:flex;gap:8px;flex-wrap:wrap;">
                                <button type="button" class="modern-btn modern-btn-secondary" onclick="fetchStockList()">
                                    <i class="fas fa-search"></i> 获取A股列表
                                </button>
                                <button type="button" id="checkIntegrityBtn" class="modern-btn modern-btn-secondary" onclick="checkDataIntegrity()">
                                    <i class="fas fa-check-double"></i> 检查数据完整性
                                </button>
                                <button type="button" id="batchDownloadBtn" class="modern-btn modern-btn-primary" onclick="startBatchDownload()" disabled>
                                    <i class="fas fa-download"></i> 批量下载
                                </button>
                                <button type="button" id="batchCancelBtn" class="modern-btn modern-btn-danger" onclick="cancelBatchDownload()" style="display:none;">
                                    <i class="fas fa-stop"></i> 取消下载
                                </button>
                                <button type="button" id="batchResumeBtn" class="modern-btn modern-btn-secondary" onclick="resumeDownload()" style="display:none;">
                                    <i class="fas fa-redo"></i> 恢复下载
                                </button>
                            </div>
                        </div>
                        <div id="stockListInfo" class="mt-2" style="font-size:13px;color:#b0b0b0;"></div>
                        <div id="stockListTable" class="mt-2" style="max-height:400px;overflow-y:auto;display:none;"></div>
                        <div id="batchDownloadProgress" class="mt-2"></div>
                    </div>
                </div>

                <div class="action-card" id="backtest">
                    <div class="action-card-header">
                        <div class="action-card-icon backtest"><i class="fas fa-robot"></i></div>
                        <div>
                            <h5 class="action-card-title">回测配置</h5>
                            <p class="action-card-subtitle">运行策略回测分析</p>
                        </div>
                    </div>
                    <div class="action-card-body">
                        <form id="backtestForm">
                            <div class="form-grid">
                                <div class="modern-form-group">
                                    <label class="modern-label"><i class="fas fa-server"></i>数据源</label>
                                    <select class="modern-select" id="dataSource" required>
                                        <option value="">请选择</option>
                                        {% for source in data_sources %}
                                        <option value="{{ source }}">{{ source }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="modern-form-group">
                                    <label class="modern-label"><i class="fas fa-file-alt"></i>股票</label>
                                    <div class="search-select" id="stockSelectWrapper">
                                        <input type="text" class="modern-input" id="stockSearch" placeholder="搜索股票..." autocomplete="off">
                                        <input type="hidden" id="stockFile">
                                        <div class="search-dropdown" id="stockDropdown">
                                            <div class="search-options" id="stockOptions"></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="modern-form-group">
                                    <label class="modern-label"><i class="fas fa-brain"></i>策略</label>
                                    <select class="modern-select" id="strategy" required>
                                        {% for strategy_name in strategies %}
                                        <option value="{{ strategy_name }}">{{ strategy_name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="modern-form-group">
                                    <label class="modern-label"><i class="fas fa-coins"></i>初始资金</label>
                                    <input type="number" class="modern-input" id="initCash" value="5000000" min="10000" step="10000">
                                </div>
                                <div class="modern-form-group col-span-2">
                                    <label class="modern-label"><i class="fas fa-cog"></i>回测模式</label>
                                    <div class="radio-group mt-2">
                                        <div class="radio-item">
                                            <input type="radio" name="backtestType" id="singleTest" value="single" checked>
                                            <label for="singleTest"><i class="fas fa-star me-1"></i>单个股票</label>
                                        </div>
                                        <div class="radio-item">
                                            <input type="radio" name="backtestType" id="batchTest" value="batch">
                                            <label for="batchTest"><i class="fas fa-layer-group me-1"></i>批量回测</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="modern-form-group col-span-2" id="batchDateRange" style="display:none;">
                                    <label class="modern-label"><i class="fas fa-calendar-range"></i>回测日期范围 <span style="font-size:11px;color:#888;">(可选，留空则用完整数据)</span></label>
                                    <div style="display:flex;gap:8px;align-items:center;">
                                        <input type="date" class="modern-input" id="cutStart">
                                        <span style="color:#888;">至</span>
                                        <input type="date" class="modern-input" id="cutEnd">
                                    </div>
                                </div>
                                <div class="modern-form-group col-span-2">
                                    <button type="submit" class="modern-btn modern-btn-primary">
                                        <i class="fas fa-play"></i>开始回测
                                    </button>
                                </div>
                            </div>
                        </form>
                        <div id="backtestProgressArea" class="mt-3" style="display:none;">
                            <div id="backtestProgressContent"></div>
                            <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
                                <button type="button" id="backtestCancelBtn" class="modern-btn modern-btn-danger" onclick="cancelBatchBacktest()">
                                    <i class="fas fa-stop"></i> 取消回测
                                </button>
                                <button type="button" id="backtestResumeBtn" class="modern-btn modern-btn-secondary" onclick="resumeBatchBacktest()" style="display:none;">
                                    <i class="fas fa-redo"></i> 继续回测
                                </button>
                                <button type="button" id="backtestClearBtn" class="modern-btn modern-btn-danger" onclick="clearBatchBacktest()" style="display:none;">
                                    <i class="fas fa-trash"></i> 清空结果
                                </button>
                            </div>
                        </div>
                        <div id="resultMessage" class="mt-3"></div>
                        <div id="resultView" class="mt-3"></div>
                        <div id="batchResultView" class="mt-3" style="display:none;"></div>
                        <div class="result-message info mt-3" style="font-size: 12px;">
                            <i class="fas fa-info-circle"></i>
                            <span>更多配置（费率、滑点等）请在 settings 文件中配置，暂不支持单独配置</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="table-container" id="results">
                <div class="table-header-custom">
                    <div class="table-title">
                        <i class="fas fa-history"></i>
                        历史回测结果
                    </div>
                </div>

                <div class="filter-bar-custom">
                    <div class="filter-bar-row">
                        <div class="filter-item-custom">
                            <label><i class="fas fa-search"></i></label>
                            <input type="text" class="filter-input" id="stockFilter" placeholder="股票名称" oninput="debounceFilter()">
                        </div>
                        <div class="filter-item-custom">
                            <label><i class="fas fa-brain"></i></label>
                            <select class="filter-select" id="strategyFilter">
                                <option value="">策略</option>
                                {% for strategy_name in strategies %}
                                <option value="{{ strategy_name }}">{{ strategy_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="filter-item-custom date-range">
                            <label><i class="fas fa-calendar"></i></label>
                            <input type="date" class="filter-input" id="dateFilterStart" placeholder="开始日期">
                            <span class="date-separator">至</span>
                            <input type="date" class="filter-input" id="dateFilterEnd" placeholder="结束日期">
                        </div>
                        <button class="filter-btn" onclick="applyFilters()">
                            <i class="fas fa-search"></i> 搜索
                        </button>
                        <button class="filter-btn reset" onclick="resetFilters()">
                            <i class="fas fa-undo"></i> 重置
                        </button>
                    </div>
                </div>

                <div class="stats-row">
                    <div class="mini-stat">
                        <div class="mini-stat-icon blue"><i class="fas fa-database"></i></div>
                        <div>
                            <div class="mini-stat-value">3</div>
                            <div class="mini-stat-label">数据源</div>
                        </div>
                    </div>
                    <div class="mini-stat">
                        <div class="mini-stat-icon green"><i class="fas fa-brain"></i></div>
                        <div>
                            <div class="mini-stat-value" id="strategyCount">-</div>
                            <div class="mini-stat-label">交易策略</div>
                        </div>
                    </div>
                    <div class="mini-stat">
                        <div class="mini-stat-icon orange"><i class="fas fa-chart-bar"></i></div>
                        <div>
                            <div class="mini-stat-value" id="resultCountValue">-</div>
                            <div class="mini-stat-label">回测结果</div>
                        </div>
                    </div>
                    <div class="mini-stat">
                        <div class="mini-stat-icon purple"><i class="fas fa-clock"></i></div>
                        <div>
                            <div class="mini-stat-value">4年</div>
                            <div class="mini-stat-label">历史数据</div>
                        </div>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="data-table-custom">
                        <thead>
                            <tr>
                                <th><i class="fas fa-hashtag me-1"></i>序号</th>
                                <th><i class="fas fa-brain me-1"></i>策略</th>
                                <th><i class="fas fa-clock me-1"></i>时间戳</th>
                                <th><i class="fas fa-chart-bar me-1"></i>股票</th>
                                <th><i class="fas fa-clock me-1"></i>运行时间</th>
                                <th><i class="fas fa-cog me-1"></i>操作</th>
                            </tr>
                        </thead>
                        <tbody id="resultsTable"></tbody>
                    </table>
                </div>

                <div id="noResults" class="empty-state-custom d-none">
                    <div class="empty-icon"><i class="fas fa-folder-open"></i></div>
                    <div class="empty-title">暂无历史记录</div>
                    <div class="empty-text">运行一次回测后，结果将显示在这里</div>
                </div>

                <div class="pagination-custom" id="paginationContainer">
                    <div class="pagination-info-custom">
                        共 <strong id="totalResults">0</strong> 条记录
                    </div>
                    <div class="pagination-controls-custom">
                        <button class="page-btn-custom" id="prevPage" onclick="goToPage(currentPage - 1)">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <div id="pagination"></div>
                        <button class="page-btn-custom" id="nextPage" onclick="goToPage(currentPage + 1)">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script>
        let currentPage = 1;
        const pageSize = 10;

        function scrollToSection(sectionId) {
            const section = document.getElementById(sectionId);
            if (section) {
                const offset = 80;
                const elementPosition = section.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset - offset;

                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });

                setTimeout(() => {
                    section.classList.remove('section-highlight');
                    void section.offsetWidth;
                    section.classList.add('section-highlight');
                }, 300);
            }
        }

        function updateNavActiveState(hash) {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });

            const targetId = hash.replace('#', '') || 'data-acquisition';
            const activeLink = document.querySelector(`.nav-link[href="#${targetId}"]`);
            if (activeLink) {
                activeLink.classList.add('active');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            const fourYearsAgo = new Date();
            fourYearsAgo.setFullYear(today.getFullYear() - 4);

            const formatDate = (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            document.getElementById('startDate').value = formatDate(fourYearsAgo);
            document.getElementById('endDate').value = formatDate(today);
            document.getElementById('endDate').max = formatDate(today);

            document.getElementById('strategyCount').textContent = {{ strategies|length }};

            loadResults(1);

            const hash = window.location.hash;
            if (hash) {
                updateNavActiveState(hash);
                setTimeout(() => scrollToSection(hash.replace('#', '')), 100);
            }
        });

        document.querySelectorAll('.nav-link[href^="#"]').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const hash = this.getAttribute('href').replace('#', '');
                window.history.pushState(null, '', '#' + hash);
                updateNavActiveState(hash);
                scrollToSection(hash);
            });
        });

        window.addEventListener('hashchange', function() {
            const hash = window.location.hash.replace('#', '');
            if (hash) {
                updateNavActiveState(hash);
                scrollToSection(hash);
            }
        });

        document.getElementById('dataSourceAcquire').addEventListener('change', function() {
            const dataSource = this.value;
            const marketSelect = document.getElementById('market');
            marketSelect.innerHTML = '<option value="">请选择</option>';

            if (dataSource === 'futu') {
                marketSelect.add(new Option('港股', 'hk'));
                marketSelect.add(new Option('A股', 'cn'));
            } else if (dataSource === 'baostock') {
                marketSelect.add(new Option('A股', 'cn'));
            } else if (dataSource === 'akshare') {
                marketSelect.add(new Option('港股', 'hk'));
                marketSelect.add(new Option('美股', 'us'));
                marketSelect.add(new Option('A股', 'cn'));
            }
        });

        document.getElementById('dataAcquisitionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const resultDiv = document.getElementById('dataAcquisitionResult');
            resultDiv.innerHTML = `
                <div class="result-message info">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>正在获取数据，请稍候...</span>
                </div>
            `;

            fetch('/acquire_stock_data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    market: document.getElementById('market').value,
                    data_source: document.getElementById('dataSourceAcquire').value,
                    stock_code: document.getElementById('stockCode').value,
                    start_date: document.getElementById('startDate').value,
                    end_date: document.getElementById('endDate').value,
                    adjust_type: document.getElementById('adjustType').value
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="result-message success">
                            <i class="fas fa-check-circle"></i>
                            <span>${data.message}</span>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result-message error">
                            <i class="fas fa-times-circle"></i>
                            <span>${data.message}</span>
                        </div>
                    `;
                }
            })
            .catch(error => {
                resultDiv.innerHTML = `
                    <div class="result-message error">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span>获取数据失败</span>
                    </div>
                `;
            });
        });

        let stocks = [];
        let selectedStockIndex = -1;

        const stockSearch = document.getElementById('stockSearch');
        const stockDropdown = document.getElementById('stockDropdown');
        const stockOptions = document.getElementById('stockOptions');
        const stockFileInput = document.getElementById('stockFile');

        function renderStockOptions(filter = '') {
            stockOptions.innerHTML = '';
            const filtered = stocks.filter(s => {
                const name = s.file.replace('.csv', '').toLowerCase();
                return name.includes(filter.toLowerCase());
            });

            if (filtered.length === 0) {
                stockOptions.innerHTML = '<div class="search-empty">没有找到匹配的股票</div>';
                return;
            }

            filtered.forEach((stock, index) => {
                const originalIndex = stocks.indexOf(stock);
                const div = document.createElement('div');
                div.className = 'search-option' + (originalIndex === selectedStockIndex ? ' selected' : '');

                let displayName = stock.file.replace('.csv', '');
                if (filter) {
                    const regex = new RegExp(`(${filter})`, 'gi');
                    displayName = displayName.replace(regex, '<mark>$1</mark>');
                }
                div.innerHTML = displayName;
                div.addEventListener('click', () => selectStock(originalIndex));
                stockOptions.appendChild(div);
            });
        }

        function selectStock(index) {
            if (index >= 0 && index < stocks.length) {
                selectedStockIndex = index;
                const stock = stocks[index];
                stockFileInput.value = stock.file;
                stockSearch.value = stock.file.replace('.csv', '');
                stockDropdown.classList.remove('show');
                renderStockOptions('');
            }
        }

        stockSearch.addEventListener('focus', () => {
            stockDropdown.classList.add('show');
            renderStockOptions(stockSearch.value);
        });

        stockSearch.addEventListener('input', (e) => {
            stockDropdown.classList.add('show');
            renderStockOptions(e.target.value);
        });

        document.addEventListener('click', (e) => {
            if (!document.getElementById('stockSelectWrapper').contains(e.target)) {
                stockDropdown.classList.remove('show');
            }
        });

        stockSearch.addEventListener('keydown', (e) => {
            const options = stockOptions.querySelectorAll('.search-option');
            if (options.length === 0) return;

            let currentIndex = -1;
            options.forEach((opt, i) => {
                if (opt.classList.contains('selected')) currentIndex = i;
            });

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                currentIndex = currentIndex < options.length - 1 ? currentIndex + 1 : 0;
                options.forEach(opt => opt.classList.remove('selected'));
                options[currentIndex].classList.add('selected');
                options[currentIndex].scrollIntoView({ block: 'nearest' });
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                currentIndex = currentIndex > 0 ? currentIndex - 1 : options.length - 1;
                options.forEach(opt => opt.classList.remove('selected'));
                options[currentIndex].classList.add('selected');
                options[currentIndex].scrollIntoView({ block: 'nearest' });
            } else if (e.key === 'Enter' && currentIndex >= 0) {
                e.preventDefault();
                const filtered = stocks.filter(s => s.file.replace('.csv', '').toLowerCase().includes(stockSearch.value.toLowerCase()));
                if (filtered[currentIndex]) {
                    const originalIndex = stocks.indexOf(filtered[currentIndex]);
                    selectStock(originalIndex);
                }
            } else if (e.key === 'Escape') {
                stockDropdown.classList.remove('show');
            }
        });

        function pollBacktestProgress(taskId) {
            fetch('/api/backtest_progress/' + taskId + '?_t=' + Date.now())
                .then(response => response.json())
                .then(data => {
                    if (!data.success) {
                        clearInterval(backtestPollTimer);
                        backtestPollTimer = null;
                        document.getElementById('backtestProgressContent').innerHTML =
                            '<span style="color:#e74c3c;"><i class="fas fa-times-circle"></i> ' + data.message + '</span>';
                        return;
                    }
                    const p = data.data;
                    const pct = p.total > 0 ? Math.round((p.completed_count + p.failed_count) / p.total * 100) : 0;
                    const doneCount = (p.completed_count || 0) + (p.failed_count || 0);
                    const progressContent = document.getElementById('backtestProgressContent');
                    const cancelBtn = document.getElementById('backtestCancelBtn');
                    const resumeBtn = document.getElementById('backtestResumeBtn');
                    const clearBtn = document.getElementById('backtestClearBtn');

                    let html = '<div style="margin:8px 0;">';

                    if (p.status === 'running') {
                        html += '<div style="display:flex;justify-content:space-between;font-size:13px;color:#b0b0b0;">';
                        html += '<span><i class="fas fa-spinner fa-spin"></i> 回测中</span>';
                        html += '<span>' + doneCount + '/' + p.total + ' (' + pct + '%) 成功:' + (p.completed_count || 0) + ' 失败:' + (p.failed_count || 0) + '</span>';
                        html += '</div>';
                        html += '<div style="background:#333;border-radius:4px;height:8px;margin-top:4px;overflow:hidden;">';
                        html += '<div style="background:linear-gradient(90deg,#667eea,#764ba2);height:100%;width:' + pct + '%;transition:width 0.3s;"></div>';
                        html += '</div>';
                        if (p.current_stock) {
                            html += '<div style="font-size:12px;color:#888;margin-top:4px;">当前: ' + p.current_stock + '</div>';
                        }
                        currentBacktestDir = p.batch_dir || currentBacktestDir;
                        cancelBtn.style.display = 'inline-block';
                        resumeBtn.style.display = 'none';
                        clearBtn.style.display = 'none';
                    } else if (p.status === 'completed') {
                        html += '<div style="display:flex;justify-content:space-between;font-size:13px;color:#2ecc71;">';
                        html += '<span><i class="fas fa-check-circle"></i> 回测完成</span>';
                        html += '<span>' + doneCount + '/' + p.total + ' (' + pct + '%) 成功:' + (p.completed_count || 0) + ' 失败:' + (p.failed_count || 0) + '</span>';
                        html += '</div>';
                        html += '<div style="background:#333;border-radius:4px;height:8px;margin-top:4px;overflow:hidden;">';
                        html += '<div style="background:#2ecc71;height:100%;width:100%;"></div>';
                        html += '</div>';
                        cancelBtn.style.display = 'none';
                        resumeBtn.style.display = 'none';
                        clearBtn.style.display = 'inline-block';
                        currentBacktestDir = p.batch_dir || currentBacktestDir;

                        clearInterval(backtestPollTimer);
                        backtestPollTimer = null;
                        localStorage.removeItem('lastBacktestTaskId');

                        // 渲染结果
                        if (p.results && p.summary) {
                            renderBatchResults(p.results, p.summary, currentBacktestDir);
                        }
                    } else if (p.status === 'cancelled') {
                        html += '<div style="display:flex;justify-content:space-between;font-size:13px;color:#f39c12;">';
                        html += '<span><i class="fas fa-stop-circle"></i> 已取消</span>';
                        html += '<span>' + doneCount + '/' + p.total + ' (' + pct + '%) 成功:' + (p.completed_count || 0) + ' 失败:' + (p.failed_count || 0) + '</span>';
                        html += '</div>';
                        html += '<div style="background:#333;border-radius:4px;height:8px;margin-top:4px;overflow:hidden;">';
                        html += '<div style="background:#f39c12;height:100%;width:' + pct + '%;"></div>';
                        html += '</div>';
                        cancelBtn.style.display = 'none';
                        resumeBtn.style.display = 'inline-block';
                        clearBtn.style.display = 'inline-block';
                        currentBacktestDir = p.batch_dir || currentBacktestDir;

                        clearInterval(backtestPollTimer);
                        backtestPollTimer = null;
                        localStorage.setItem('lastBacktestTaskId', taskId);
                    } else if (p.status === 'failed') {
                        html += '<div style="font-size:13px;color:#e74c3c;">';
                        html += '<i class="fas fa-times-circle"></i> 回测失败: ' + (p.error || '未知错误');
                        html += '</div>';
                        cancelBtn.style.display = 'none';
                        resumeBtn.style.display = 'none';
                        clearBtn.style.display = 'inline-block';
                        clearInterval(backtestPollTimer);
                        backtestPollTimer = null;
                        localStorage.removeItem('lastBacktestTaskId');
                    }

                    html += '</div>';
                    progressContent.innerHTML = html;
                })
                .catch(function(e) {
                    clearInterval(backtestPollTimer);
                    backtestPollTimer = null;
                });
        }

        function cancelBatchBacktest() {
            if (!currentBacktestTaskId) return;
            document.getElementById('backtestProgressContent').innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在取消...';

                    if (data.success) {
                        document.getElementById('backtestProgressContent').innerHTML = '<span style="color:#f39c12;"><i class="fas fa-stop-circle"></i> 已发送取消信号</span>';

        function resumeBatchBacktest() {

            progressContent.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在继续回测...';

            const body = {

                resume_task_id: currentBacktestTaskId
            };

            fetch('/run_backtest_async', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)

        function clearBatchBacktest() {
            if (!currentBacktestDir && !currentBacktestTaskId) return;
            const progressContent = document.getElementById('backtestProgressContent');

            if (!confirm('确定清空当前回测结果数据？此操作不可恢复。')) return;

            progressContent.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在清空...';
            fetch('/api/backtest_clear', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    batch_dir: currentBacktestDir,
                    task_id: currentBacktestTaskId
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('backtestProgressArea').style.display = 'none';
                    document.getElementById('batchResultView').innerHTML = '';
                    document.getElementById('batchResultView').style.display = 'none';
                    document.getElementById('resultMessage').innerHTML = `
                        <div class="result-message info">
                            <i class="fas fa-info-circle"></i>
                            <span>已清空回测结果，下次点击开始回测将是全新一轮</span>
                        </div>
                    `;
                    currentBacktestTaskId = null;
                    currentBacktestDir = null;
                    localStorage.removeItem('lastBacktestTaskId');

                } else {
                    progressContent.innerHTML = '<span style="color:#e74c3c;"><i class="fas fa-times-circle"></i> ' + data.message + '</span>';
                }
            })

                progressContent.innerHTML = '<span style="color:#e74c3c;"><i class="fas fa-times-circle"></i> 清空失败: ' + e.message + '</span>';

        let filterTimeout;

        function debounceFilter() {
            clearTimeout(filterTimeout);
            filterTimeout = setTimeout(applyFilters, 500);

        function loadResults(page = 1) {
            const stockFilter = document.getElementById('stockFilter')?.value || '';
            const strategyFilter = document.getElementById('strategyFilter')?.value || '';
            const dateFilterStart = document.getElementById('dateFilterStart')?.value || '';
            const dateFilterEnd = document.getElementById('dateFilterEnd')?.value || '';

            const params = new URLSearchParams();
            params.append('page', page);
            params.append('page_size', pageSize);
            if (stockFilter) params.append('stock', stockFilter);
            if (strategyFilter) params.append('strategy', strategyFilter);
            if (dateFilterStart) params.append('date_start', dateFilterStart);
            if (dateFilterEnd) params.append('date_end', dateFilterEnd);

            fetch(`/get_backtest_results?${params.toString()}`)
                .then(response => response.json())
                .then(data => {
                    if (!data.success) return;

                    currentPage = page;
                    const resultsTable = document.getElementById('resultsTable');
                    const noResults = document.getElementById('noResults');
                    const paginationContainer = document.getElementById('paginationContainer');

                    resultsTable.innerHTML = '';
                    document.getElementById('resultCountValue').textContent = data.data.total || 0;

                    if (data.data.results.length > 0) {
                        noResults.classList.add('d-none');
                        paginationContainer.style.display = 'flex';

                        data.data.results.forEach((result, index) => {
                            const row = document.createElement('tr');
                            const serialNumber = (page - 1) * pageSize + index + 1;
                            row.innerHTML = `
                                <td class="text-secondary">#${serialNumber}</td>
                                <td>${result.strategy || '-'}</td>
                                <td class="text-secondary">${result.timestamp || '-'}</td>
                                <td><strong>${result.stock}</strong>${result.has_summary ? ' <span class="stock-badge">批量</span>' : ''}</td>
                                <td class="text-secondary">${result.run_time}</td>
                                <td><a href="/show_result/${result.path}" target="_blank" class="view-btn"><i class="fas fa-chart-line"></i> 查看</a></td>
                            `;
                            resultsTable.appendChild(row);
                        });

                        document.getElementById('totalResults').textContent = data.data.total;
                        renderPagination(page, data.data.total_pages);
                    } else {
                        noResults.classList.remove('d-none');
                        paginationContainer.style.display = 'none';
                        document.getElementById('totalResults').textContent = '0';
                    }
                });
        }

        function renderPagination(page, totalPages) {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            document.getElementById('prevPage').className = `page-btn-custom ${page === 1 ? 'disabled' : ''}`;
            document.getElementById('nextPage').className = `page-btn-custom ${page === totalPages ? 'disabled' : ''}`;

            const maxButtons = 5;
            let startPage = Math.max(1, page - Math.floor(maxButtons / 2));
            let endPage = Math.min(totalPages, startPage + maxButtons - 1);

            if (endPage - startPage + 1 < maxButtons) {
                startPage = Math.max(1, endPage - maxButtons + 1);
            }

            for (let i = startPage; i <= endPage; i++) {
                const pageItem = document.createElement('button');
                pageItem.className = `page-btn-custom ${i === page ? 'active' : ''}`;
                pageItem.textContent = i;
                pageItem.addEventListener('click', () => goToPage(i));
                pagination.appendChild(pageItem);
            }
        }

        function goToPage(page) {
            const totalPages = parseInt(document.getElementById('totalResults').textContent) || 0;
            const totalPageCalc = Math.ceil(totalPages / pageSize);
            if (page >= 1 && page <= totalPageCalc) {
                loadResults(page);
            }
        }

                    if (data.success) {
                        downloadedStockConfigs = data.data.stocks || [];
                        info.innerHTML = `<span style="color:#2ecc71;"><i class="fas fa-check-circle"></i> 获取到 <strong>${downloadedStockConfigs.length}</strong> 只股票</span>`;

                        // load integrity config for color coding
                        fetch('/api/stocks/load_config')
                            .then(r => r.json())
                            .then(cfg => {
                                integrityConfig = cfg.data || null;
                                renderStockList();
                            })
                            .catch(() => renderStockList());
                    } else {
                        info.innerHTML = `<span style="color:#e74c3c;"><i class="fas fa-times-circle"></i> ${data.message}</span>`;
                    }
                })
                .catch(e => {
                    info.innerHTML = `<span style="color:#e74c3c;"><i class="fas fa-times-circle"></i> 获取失败: ${e.message}</span>`;
                });
        }

        function isMainBoard(code) {
            return /^sh\.60[0135]/.test(code) || /^sz\.00[012]/.test(code);
        }
        function isSTAR(code) {
            return /^sh\.688/.test(code);
        }

        function renderStockList() {
            const table = document.getElementById('stockListTable');
            if (downloadedStockConfigs.length === 0) {
                table.style.display = 'none';
                document.getElementById('batchDownloadBtn').disabled = true;
                return;
            }

            const excludeMainBoard = document.getElementById('excludeMainBoard').checked;
            const excludeSTAR = document.getElementById('excludeSTAR').checked;
            const filtered = downloadedStockConfigs.filter(s => {
                if (excludeMainBoard && isMainBoard(s.stock_code)) return false;
                if (excludeSTAR && isSTAR(s.stock_code)) return false;
                return true;
            });

            const stockStatus = {};
            if (integrityConfig && integrityConfig.stocks) {
                Object.entries(integrityConfig.stocks).forEach(([code, s]) => {
                    if (s.is_complete && s.in_range) stockStatus[code] = 'complete';
                    else if (s.data_days > 0) stockStatus[code] = 'incomplete';
                    else stockStatus[code] = 'no_data';
                });
            }

            let completeCount = 0, incompleteCount = 0, noDataCount = 0;
            filtered.forEach(s => {
                const v = stockStatus[s.stock_code];
                if (v === 'complete') completeCount++;
                else if (v === 'incomplete') incompleteCount++;
                else if (v === 'no_data') noDataCount++;
            });

            let header = `<div style="font-size:12px;color:#b0b0b0;margin-bottom:6px;">`;
            if (completeCount > 0) header += `<span style="color:#2ecc71;">● 完整 ${completeCount}</span> `;
            if (incompleteCount > 0) header += `<span style="color:#f39c12;">● 不完整 ${incompleteCount}</span> `;
            if (noDataCount > 0) header += `<span style="color:#888;">● 无数据 ${noDataCount}</span>`;
            if (filtered.length === 0) header += '无匹配股票';
            else if (completeCount + incompleteCount + noDataCount === 0) header += '尚未检查完整性';
            header += `</div>`;

            let html = header + '<table class="data-table-custom" style="font-size:12px;"><thead><tr><th>序号</th><th>代码</th><th>名称</th><th>状态</th><th>已有数据</th></tr></thead><tbody>';
            filtered.forEach((s, i) => {
                let status = stockStatus[s.stock_code];
                let dot = '<span style="color:#888;">●</span>';
                let statusText = '-';
                let dateInfo = '-';
                if (status === 'complete') { dot = '<span style="color:#2ecc71;">●</span>'; statusText = '完整'; }
                else if (status === 'incomplete') { dot = '<span style="color:#f39c12;">●</span>'; statusText = '不完整'; }
                else if (status === 'no_data') { dot = '<span style="color:#888;">●</span>'; statusText = '无数据'; }

                if (integrityConfig && integrityConfig.stocks && integrityConfig.stocks[s.stock_code]) {
                    const cs = integrityConfig.stocks[s.stock_code];
                    dateInfo = cs.data_start ? `${cs.data_start} ~ ${cs.data_end} (${cs.data_days}天)` : '-';
                }
                html += `<tr><td>${i+1}</td><td>${s.stock_code}</td><td>${s.stock_name}</td><td>${dot} ${statusText}</td><td style="font-size:11px;color:#888;">${dateInfo}</td></tr>`;
            });
            html += '</tbody></table>';
            table.innerHTML = html;
            table.style.display = 'block';
            scrollToSection('batch-download');
        }

        function checkDataIntegrity() {
            const info = document.getElementById('stockListInfo');
            info.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在扫描已有CSV检查完整性...';
            document.getElementById('checkIntegrityBtn').disabled = true;

            const today = new Date();
            const fourYearsAgo = new Date();
            fourYearsAgo.setFullYear(today.getFullYear() - 4);
            const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

            fetch('/api/stocks/check_integrity', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    data_source: 'baostock',
                    target_start: fmt(fourYearsAgo),
                    target_end: fmt(today),
                    stock_configs: downloadedStockConfigs
                })
            })
            .then(r => r.json())
            .then(data => {
                document.getElementById('checkIntegrityBtn').disabled = false;
                if (data.success) {
                    integrityConfig = data.data;
                    const s = data.data.summary;
                    let msg = `<span style="color:#2ecc71;"><i class="fas fa-check-circle"></i> 完整性检查完成: 完整 ${s.complete} / 不完整 ${s.incomplete} / 总计 ${s.total_scanned}</span>`;
                    if (data.plan && data.plan.skipped > 0) {
                        msg += `<br><span style="color:#888;font-size:12px;">下载计划: 全量 ${data.plan.full} / 增量 ${data.plan.incremental} / 跳过 ${data.plan.skipped}</span>`;
                    }
                    info.innerHTML = msg;
                    document.getElementById('batchDownloadBtn').disabled = false;
                    if (downloadedStockConfigs.length > 0) renderStockList();
                    else { info.innerHTML += '<br><span style="color:#f39c12;">请先"获取A股列表"以查看各股票状态</span>'; }
                } else {
                    info.innerHTML = `<span style="color:#e74c3c;"><i class="fas fa-times-circle"></i> ${data.message}</span>`;
                }
            })
            .catch(e => {
                document.getElementById('checkIntegrityBtn').disabled = false;
                info.innerHTML = `<span style="color:#e74c3c;"><i class="fas fa-times-circle"></i> 检查失败: ${e.message}</span>`;
            });
        }

        function cancelBatchDownload() {
            if (!currentDownloadTaskId) return;
            const progress = document.getElementById('batchDownloadProgress');
            progress.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在取消...';
            fetch(`/api/cancel_download/${currentDownloadTaskId}`, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        progress.innerHTML = '<span style="color:#f39c12;"><i class="fas fa-stop-circle"></i> 已发送取消信号，等待同步config...</span>';
                    }
                });
        }

        function startBatchDownload() {
            if (downloadedStockConfigs.length === 0) return;
            // load config for dedup
            fetch('/api/stocks/load_config')
                .then(r => r.json())
                .then(cfg => {
                    integrityConfig = cfg.data || null;
                    launchDownload(null);
                })
                .catch(() => launchDownload(null));
        }

        function resumeDownload() {
            if (!currentDownloadTaskId) return;
            launchDownload(currentDownloadTaskId);
        }

        function launchDownload(resumeTaskId) {
            const progress = document.getElementById('batchDownloadProgress');
            const btn = document.getElementById('batchDownloadBtn');
            const resumeBtn = document.getElementById('batchResumeBtn');
            btn.disabled = true;
            resumeBtn.style.display = 'none';

            const today = new Date();
            const fourYearsAgo = new Date();
            fourYearsAgo.setFullYear(today.getFullYear() - 4);
            const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

            progress.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在启动下载任务...';

            const body = {
                stock_configs: downloadedStockConfigs,
                start_date: fmt(fourYearsAgo),
                end_date: fmt(today),
                parallel: true
            };
            if (resumeTaskId) body.resume_task_id = resumeTaskId;

            fetch('/acquire_stock_data_batch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    currentDownloadTaskId = data.data.task_id;
                    localStorage.setItem('lastDownloadTaskId', currentDownloadTaskId);
                    startPolling(currentDownloadTaskId);
                } else {
                    progress.innerHTML = `<span style="color:#e74c3c;"><i class="fas fa-times-circle"></i> ${data.message}</span>`;
                    btn.disabled = false;
                }
            })
            .catch(e => {
                progress.innerHTML = `<span style="color:#e74c3c;"><i class="fas fa-times-circle"></i> 启动失败: ${e.message}</span>`;
                btn.disabled = false;
            });
        }

        function startPolling(taskId) {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(() => pollProgress(taskId), 1000);
        }

        function pollProgress(taskId) {
            fetch(`/api/download_progress/${taskId}?_t=${Date.now()}`)
                .then(r => r.json())
                .then(data => {
                    if (!data.success) return;
                    const p = data.data;
                    const progress = document.getElementById('batchDownloadProgress');
                    const pct = p.total > 0 ? Math.round(p.completed / p.total * 100) : 0;

                    let html = `<div style="margin:8px 0;">
                        <div style="display:flex;justify-content:space-between;font-size:13px;color:#b0b0b0;">
                            <span><i class="fas fa-spinner fa-spin"></i> ${p.status === 'running' ? '下载中' : p.status === 'completed' ? '已完成' : '未找到'}</span>
                            <span>${p.completed}/${p.total} (${pct}%) 成功:${p.success} 失败:${p.failed}</span>
                        </div>
                        <div style="background:#333;border-radius:4px;height:8px;margin-top:4px;overflow:hidden;">
                            <div style="background:#2ecc71;height:100%;width:${pct}%;transition:width 0.3s;"></div>
                        </div>`;

                    if (p.current_stock) {
                        html += `<div style="font-size:12px;color:#888;margin-top:4px;">当前: ${p.current_stock}</div>`;
                    }

                    if (p.status === 'completed') {
                        html += `<div style="margin-top:8px;color:#2ecc71;"><i class="fas fa-check-circle"></i> 下载完成! 成功 ${p.success} 只，失败 ${p.failed} 只</div>`;
                        clearInterval(pollTimer);
                        pollTimer = null;
                        document.getElementById('batchDownloadBtn').disabled = false;
                        document.getElementById('batchCancelBtn').style.display = 'none';
                        document.getElementById('batchResumeBtn').style.display = 'none';
                        localStorage.removeItem('lastDownloadTaskId');
                    } else if (p.status === 'cancelled') {
                        html += `<div style="margin-top:8px;color:#f39c12;"><i class="fas fa-stop-circle"></i> 已取消: ${p.completed}/${p.total} (成功:${p.success} 失败:${p.failed})</div>`;
                        clearInterval(pollTimer);
                        pollTimer = null;
                        document.getElementById('batchDownloadBtn').disabled = false;
                        document.getElementById('batchCancelBtn').style.display = 'none';
                        document.getElementById('batchResumeBtn').style.display = 'inline-block';
                        localStorage.setItem('lastDownloadTaskId', currentDownloadTaskId);
                    } else if (p.status === 'running') {
                        document.getElementById('batchCancelBtn').style.display = 'inline-block';
                        document.getElementById('batchResumeBtn').style.display = 'none';
                    }

                    html += '</div>';
                    progress.innerHTML = html;
                })
                .catch(e => {
                    clearInterval(pollTimer);
                    pollTimer = null;
                });
        }

        // Check for resume on page load
        (function() {
            const savedTaskId = localStorage.getItem('lastDownloadTaskId');
            if (savedTaskId) {
                fetch(`/api/download_progress/${savedTaskId}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.success && data.data && data.data.status === 'running') {
                            currentDownloadTaskId = savedTaskId;
                            document.getElementById('batchResumeBtn').style.display = 'inline-block';
                            document.getElementById('batchDownloadProgress').innerHTML = '<div style="color:#f39c12;"><i class="fas fa-exclamation-triangle"></i> 检测到未完成的下载任务，点击"恢复下载"继续</div>';
                            document.getElementById('batchDownloadBtn').disabled = true;
                        } else if (data.success && data.data && data.data.status === 'completed') {
                            localStorage.removeItem('lastDownloadTaskId');
                            document.getElementById('batchDownloadProgress').innerHTML = `<div style="color:#2ecc71;"><i class="fas fa-check-circle"></i> 上次下载已完成: ${data.data.success}/${data.data.total} 成功</div>`;
                        }
                    });
            }

            // 检查未完成的批量回测任务
            const savedBacktestId = localStorage.getItem('lastBacktestTaskId');
            if (savedBacktestId) {
                fetch(`/api/backtest_progress/${savedBacktestId}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.success && data.data) {
                            const p = data.data;
                            if (p.status === 'running') {
                                currentBacktestTaskId = savedBacktestId;
                                currentBacktestDir = p.batch_dir || '';
                                document.getElementById('backtestProgressArea').style.display = 'block';
                                document.getElementById('backtestProgressContent').innerHTML = '<div style="color:#f39c12;"><i class="fas fa-exclamation-triangle"></i> 检测到未完成的回测任务，点击"继续回测"恢复</div>';
                                document.getElementById('backtestCancelBtn').style.display = 'none';
                                document.getElementById('backtestResumeBtn').style.display = 'inline-block';
                                document.getElementById('backtestClearBtn').style.display = 'inline-block';
                            } else if (p.status === 'cancelled') {
                                currentBacktestTaskId = savedBacktestId;
                                currentBacktestDir = p.batch_dir || '';
                                document.getElementById('backtestProgressArea').style.display = 'block';
                                document.getElementById('backtestProgressContent').innerHTML = `<div style="color:#f39c12;"><i class="fas fa-exclamation-triangle"></i> 上次回测已取消 (${(p.completed_count||0)+(p.failed_count||0)}/${p.total})，可继续或清空</div>`;
                                document.getElementById('backtestCancelBtn').style.display = 'none';
                                document.getElementById('backtestResumeBtn').style.display = 'inline-block';
                                document.getElementById('backtestClearBtn').style.display = 'inline-block';
                            } else if (p.status === 'completed') {
                                localStorage.removeItem('lastBacktestTaskId');
                                document.getElementById('backtestProgressArea').style.display = 'block';
                                document.getElementById('backtestProgressContent').innerHTML = `<div style="color:#2ecc71;"><i class="fas fa-check-circle"></i> 上次回测已完成: ${p.completed_count}/${p.total} 成功</div>`;
                                document.getElementById('backtestCancelBtn').style.display = 'none';
                                document.getElementById('backtestResumeBtn').style.display = 'none';
                                document.getElementById('backtestClearBtn').style.display = 'inline-block';
                                currentBacktestDir = p.batch_dir || '';
                                if (p.results && p.summary) {
                                    renderBatchResults(p.results, p.summary, currentBacktestDir);
                                }
                            }
                        } else {
                            localStorage.removeItem('lastBacktestTaskId');
                        }
                    })
                    .catch(() => {
                        localStorage.removeItem('lastBacktestTaskId');
                    });
            }
        })();

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            notification.innerHTML = `
                <div class="toast-content ${type}">
                    <i class="fas ${icon} toast-icon"></i>
                    <span class="toast-message">${message}</span>
                </div>
            `;
            notification.className = `notification ${type} show`;
            
            clearTimeout(notification.hideTimeout);
            notification.hideTimeout = setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        window.addEventListener('load', () => loadResults(1));
    </script>
</body>
</html>
